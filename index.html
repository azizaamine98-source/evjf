<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff4f6d;
    --green: #00c896;
    --dark: #1a1a2e;
    --card-bg: #fff;
    --text: #1a1a2e;
    --muted: #888;
    --shadow: 0 20px 60px rgba(0,0,0,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f5f0eb;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(255,79,109,0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(0,200,150,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  /* HEADER */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    background: rgba(245,240,235,0.90);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--pink); letter-spacing: -0.5px; }
  .logo span { font-style: italic; }
  .counter { font-size: 13px; color: var(--muted); font-weight: 500; }

  /* PROGRESS BAR */
  .progress-bar { position: fixed; top: 53px; left: 0; right: 0; height: 3px; background: rgba(0,0,0,0.07); z-index: 99; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--pink), #ff8fa3); transition: width 0.4s ease; border-radius: 0 2px 2px 0; }

  /* MAIN LAYOUT */
  .main {
    width: 100%;
    max-width: 400px;
    padding: 0 12px;
    margin-top: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: calc(100vh - 64px);
  }

  /* CARD WRAPPER (scrollable) */
  .card-wrap {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    border-radius: 20px;
    box-shadow: var(--shadow);
    background: white;
    margin-top: 14px;
    scrollbar-width: none;
    will-change: transform;
  }
  .card-wrap::-webkit-scrollbar { display: none; }

  /* STAMPS */
  .stamps-row {
    position: absolute;
    top: 28px; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 25;
    padding: 0 16px;
  }
  .stamp-like, .stamp-nope {
    font-family: 'DM Serif Display', serif;
    font-size: 34px;
    font-weight: 700;
    border-radius: 8px;
    padding: 4px 14px;
    opacity: 0;
    transition: opacity 0.1s;
    border: 4px solid;
    line-height: 1.2;
    text-align: center;
  }
  .stamp-like { color: var(--green); border-color: var(--green); transform: rotate(-12deg); }
  .stamp-nope { color: var(--pink); border-color: var(--pink); transform: rotate(12deg); }

  /* PHOTO BLOCK */
  .photo-block {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    background: linear-gradient(135deg, #e8ddd5 0%, #d4c8bc 100%);
    overflow: hidden;
    flex-shrink: 0;
  }
  .photo-block img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .emoji-big { font-size: 80px; }
  .photo-hint { font-size: 11px; color: rgba(0,0,0,0.3); text-align: center; padding: 0 20px; }

  /* PHOTO DOTS */
  .photo-dots {
    position: absolute; top: 10px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 5px; pointer-events: none; z-index: 5;
  }
  .photo-dot { width: 28px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.45); transition: background 0.2s; }
  .photo-dot.active { background: white; }

  /* NAME OVERLAY */
  .card-name-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 60px 20px 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 100%);
    color: white;
  }
  .cn-name { font-family: 'DM Serif Display', serif; font-size: 30px; line-height: 1; }
  .cn-age { font-size: 15px; opacity: 0.85; margin-top: 3px; }

  /* PROMPT BLOCK */
  .prompt-block {
    padding: 22px 20px;
    border-bottom: 1px solid #f0ebe5;
  }
  .pb-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--pink); margin-bottom: 6px; font-weight: 600; }
  .pb-q { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px; }
  .pb-a { font-family: 'DM Serif Display', serif; font-size: 19px; color: var(--text); line-height: 1.4; }

  /* TAGS */
  .tags-block { padding: 18px 20px 22px; }
  .tb-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .tags-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { background: #f5f0eb; color: #555; font-size: 12px; padding: 6px 14px; border-radius: 20px; font-weight: 500; }

  /* SCROLL HINT */
  .scroll-hint {
    text-align: center; padding: 8px 0 20px;
    font-size: 11px; color: rgba(0,0,0,0.22); letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .scroll-arrow { animation: bounce 1.4s infinite; display: inline-block; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

  /* ACTION BUTTONS */
  .actions {
    display: flex; gap: 28px; padding: 12px 0 16px;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .btn-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; }
  .btn {
    width: 68px; height: 68px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    transition: all 0.2s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.13);
  }
  .btn:active { transform: scale(0.91); }
  .btn-nope { background: linear-gradient(135deg, #ff4f6d, #ff8fa3); color: white; }
  .btn-like { background: linear-gradient(135deg, #00c896, #00e0aa); color: white; width: 78px; height: 78px; font-size: 30px; }
  .btn-label { position: absolute; bottom: 0; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }

  /* FLYING */
  .card-wrap.fly-left { animation: flyLeft 0.38s ease forwards; pointer-events: none; }
  .card-wrap.fly-right { animation: flyRight 0.38s ease forwards; pointer-events: none; }
  @keyframes flyLeft { to { transform: translateX(-130%) rotate(-18deg); opacity: 0; } }
  @keyframes flyRight { to { transform: translateX(130%) rotate(18deg); opacity: 0; } }

  /* FLAG REVEAL */
  .flag-reveal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.52);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .flag-reveal.show { opacity: 1; pointer-events: all; }
  .flag-card {
    background: white; border-radius: 24px; padding: 40px 32px;
    text-align: center; max-width: 300px; width: 90%;
    transform: scale(0.82); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.22);
  }
  .flag-reveal.show .flag-card { transform: scale(1); }
  .flag-icon { font-size: 64px; margin-bottom: 12px; display: block; }
  .flag-title { font-family: 'DM Serif Display', serif; font-size: 28px; margin-bottom: 8px; }
  .flag-title.red { color: var(--pink); }
  .flag-title.green { color: var(--green); }
  .flag-name { font-size: 14px; color: var(--muted); margin-bottom: 12px; font-weight: 500; }
  .flag-reason { font-size: 15px; line-height: 1.5; color: var(--text); margin-bottom: 24px; padding: 12px; background: #f9f6f3; border-radius: 12px; }
  .btn-continue {
    background: var(--dark); color: white; border: none;
    padding: 14px 32px; border-radius: 50px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif; letter-spacing: 0.3px; transition: all 0.2s;
  }
  .btn-continue:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26,26,46,0.25); }

  /* SCOREBOARD */
  .scoreboard {
    display: none; position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    z-index: 400; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; overflow-y: auto;
  }
  .scoreboard.show { display: flex; }
  .score-title { font-family:'DM Serif Display',serif; font-size:34px; color:white; text-align:center; margin-bottom:4px; }
  .score-subtitle { color:rgba(255,255,255,0.38); font-size:13px; margin-bottom:28px; text-align:center; }
  .score-stats { display:flex; gap:20px; margin-bottom:24px; }
  .stat-box { background:rgba(255,255,255,0.07); border-radius:16px; padding:18px 26px; text-align:center; }
  .stat-num { font-family:'DM Serif Display',serif; font-size:40px; display:block; }
  .stat-num.red { color:var(--pink); }
  .stat-num.green { color:var(--green); }
  .stat-label { font-size:11px; color:rgba(255,255,255,0.38); font-weight:500; text-transform:uppercase; letter-spacing:0.5px; }
  .score-msg { font-family:'DM Serif Display',serif; font-size:18px; color:white; text-align:center; margin-bottom:24px; font-style:italic; opacity:0.75; }
  .score-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:360px; margin-bottom:26px; }
  .score-item { background:rgba(255,255,255,0.07); border-radius:14px; padding:14px; text-align:center; border:1px solid rgba(255,255,255,0.07); }
  .score-item .s-name { font-size:13px; font-weight:600; color:white; margin-bottom:5px; }
  .score-item .s-verdict { font-size:22px; margin-bottom:3px; }
  .score-item .s-label { font-size:10px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; }
  .score-item.red-item { border-color:rgba(255,79,109,0.3); }
  .score-item.green-item { border-color:rgba(0,200,150,0.3); }
  .score-item.red-item .s-label { color:#ff4f6d; }
  .score-item.green-item .s-label { color:#00c896; }
  .btn-restart {
    background:linear-gradient(135deg,var(--pink),#ff8fa3); color:white; border:none;
    padding:15px 38px; border-radius:50px; font-size:15px; font-weight:600;
    cursor:pointer; font-family:'DM Sans',sans-serif;
    box-shadow:0 10px 28px rgba(255,79,109,0.35); transition:all 0.2s;
  }
  .btn-restart:hover { transform:translateY(-2px); }
</style>

let currentIndex = 0;
let results = [];
let isDragging = false;
let startX = 0, currentX = 0;
let dragStartY = 0, isHorizontalDrag = false;

function buildPhotoBlock(src, emoji, isFirst, name, age, totalPhotos, photoIdx) {
  const dots = totalPhotos > 1
    ? `<div class="photo-dots">${Array.from({length: totalPhotos}, (_, i) =>
        `<div class="photo-dot${i === photoIdx ? ' active' : ''}"></div>`).join('')}</div>`
    : '';
  const nameOverlay = isFirst
    ? `<div class="card-name-overlay"><div class="cn-name">${name}</div><div class="cn-age">${age} ans</div></div>`
    : '';
  const inner = (src && src !== '')
    ? `<img src="${src}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="photo-placeholder" style="display:none"><div class="emoji-big">${emoji}</div><div class="photo-hint">📸 Photo introuvable : ${src}</div></div>`
    : `<div class="photo-placeholder"><div class="emoji-big">${emoji}</div><div class="photo-hint">📸 Ajoute ta photo ici</div></div>`;
  return `<div class="photo-block" data-photo-idx="${photoIdx}">${dots}${inner}${nameOverlay}</div>`;
}

function buildCardContent(profile) {
  const photos = profile.photos && profile.photos.length ? profile.photos : [""];
  const prompts = profile.prompts || [];
  const total = photos.length;

  for (let i = 0; i < total; i++) {
    html += buildPhotoBlock(photos[i], profile.emoji, i === 0, profile.name, profile.age, total, i);
    if (prompts[i]) {
      html += `<div class="prompt-block">
        <div class="pb-label">hinge</div>
        <div class="pb-q">${prompts[i].q}</div>
        <div class="pb-a">${prompts[i].a}</div>
      </div>`;
    }
  }
  for (let i = total; i < prompts.length; i++) {
    html += `<div class="prompt-block">
      <div class="pb-label">hinge</div>
      <div class="pb-q">${prompts[i].q}</div>
      <div class="pb-a">${prompts[i].a}</div>
    </div>`;
  }
  html += `<div class="tags-block">
    <div class="tb-label">Centres d'intérêt</div>
    <div class="tags-row">${profile.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
  </div>`;
  if (total > 1 || prompts.length > 1) {
    html += `<div class="scroll-hint"><span class="scroll-arrow">↓</span> Fais défiler pour voir la suite</div>`;
  }
  return html;
}

function renderCard() {
  const wrap = document.getElementById('cardWrap');
  if (currentIndex >= profiles.length) {
    wrap.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;opacity:0.3;font-family:DM Serif Display,serif;font-size:22px;flex-direction:column;gap:12px;">🎉<span>Tous les profils vus !</span></div>';
    document.getElementById('actions').style.display = 'none';
    return;
  }
  const profile = profiles[currentIndex];
  wrap.className = 'card-wrap';
  wrap.scrollTop = 0;
  wrap.innerHTML = `
    <div class="stamps-row">
      <div class="stamp-like" id="stampLike">GREEN<br>FLAG</div>
      <div class="stamp-nope" id="stampNope">RED<br>FLAG</div>
    </div>
    ${buildCardContent(profile)}
  `;

  // Update active dot on scroll
  const total = profile.photos ? profile.photos.length : 1;
  if (total > 1) {
    wrap.addEventListener('scroll', () => {
      const blocks = wrap.querySelectorAll('.photo-block');
      const st = wrap.scrollTop;
      blocks.forEach((block) => {
        const idx = parseInt(block.dataset.photoIdx);
        if (st >= block.offsetTop - 30 && st < block.offsetTop + block.offsetHeight - 30) {
          wrap.querySelectorAll('.photo-dot').forEach((d, di) => d.classList.toggle('active', di === idx));
        }
      });
    }, { passive: true });
  }

  updateCounter();
  setupDrag(wrap);
}

function updateCounter() {
  document.getElementById('counter').textContent = `${currentIndex + 1} / ${profiles.length}`;
  document.getElementById('progress').style.width = (currentIndex / profiles.length * 100) + '%';
}

function swipe(direction) {
  if (currentIndex >= profiles.length) return;
  const wrap = document.getElementById('cardWrap');
  const profile = profiles[currentIndex];
  const stamp = direction === 'right' ? document.getElementById('stampLike') : document.getElementById('stampNope');
  if (stamp) stamp.style.opacity = '1';
  wrap.classList.add(direction === 'left' ? 'fly-left' : 'fly-right');
  results.push({ profile });
  setTimeout(() => showFlagReveal(profile), 360);
}

function showFlagReveal(profile) {
  const isGreen = profile.isGreen;
  document.getElementById('flagIcon').textContent = isGreen ? '✅' : '🚩';
  document.getElementById('flagTitle').textContent = isGreen ? 'Green Flag !' : 'Red Flag !';
  document.getElementById('flagTitle').className = 'flag-title ' + (isGreen ? 'green' : 'red');
  document.getElementById('flagName').textContent = `${profile.name}, ${profile.age} ans`;
  document.getElementById('flagReason').textContent = profile.reason;
  document.getElementById('flagReveal').classList.add('show');
}

function nextCard() {
  document.getElementById('flagReveal').classList.remove('show');
  currentIndex++;
  if (currentIndex >= profiles.length) { setTimeout(showScoreboard, 300); return; }
  renderCard();
}

function showScoreboard() {
  const greens = results.filter(r => r.profile.isGreen).length;
  const reds = results.filter(r => !r.profile.isGreen).length;
  document.getElementById('greenCount').textContent = greens;
  document.getElementById('redCount').textContent = reds;
  const msgs = ["Vous avez un radar à red flags 🔴","Le groupe a du flair ! 💅","Ces mecs n'ont aucune chance 😂","La future mariée est entre de bonnes mains 💍"];
  document.getElementById('scoreMsg').textContent = msgs[Math.floor(Math.random() * msgs.length)];
  const grid = document.getElementById('scoreGrid');
  grid.innerHTML = '';
  results.forEach(r => {
    const isG = r.profile.isGreen;
    const div = document.createElement('div');
    div.className = 'score-item ' + (isG ? 'green-item' : 'red-item');
    div.innerHTML = `<div class="s-name">${r.profile.name}</div><div class="s-verdict">${isG ? '✅' : '🚩'}</div><div class="s-label">${isG ? 'Green Flag' : 'Red Flag'}</div>`;
    grid.appendChild(div);
  });
  document.getElementById('scoreboard').classList.add('show');
}

function restart() {
  currentIndex = 0; results = [];
  document.getElementById('scoreboard').classList.remove('show');
  document.getElementById('actions').style.display = 'flex';
  renderCard();
}

// =====================================================
// DRAG HORIZONTAL (swipe) + SCROLL VERTICAL
// =====================================================
function setupDrag(wrap) {
  const onStart = (clientX, clientY) => {
    isDragging = true;
    startX = clientX;
    dragStartY = clientY;
    isHorizontalDrag = false;
    currentX = 0;
  };
  const onMove = (clientX, clientY) => {
    if (!isDragging) return;
    const dx = clientX - startX;
    const dy = clientY - dragStartY;
    if (!isHorizontalDrag && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      isHorizontalDrag = Math.abs(dx) > Math.abs(dy);
    }
    if (!isHorizontalDrag) return;
    currentX = dx;
    wrap.style.transform = `translateX(${dx}px) rotate(${dx * 0.05}deg)`;
    const like = document.getElementById('stampLike');
    const nope = document.getElementById('stampNope');
    if (dx > 40) { if(like) like.style.opacity = Math.min((dx-40)/80,1); if(nope) nope.style.opacity=0; }
    else if (dx < -40) { if(nope) nope.style.opacity = Math.min((-dx-40)/80,1); if(like) like.style.opacity=0; }
    else { if(like) like.style.opacity=0; if(nope) nope.style.opacity=0; }
  };
  const onEnd = () => {
    if (!isDragging) return;
    isDragging = false;
    if (!isHorizontalDrag) { currentX = 0; return; }
    if (currentX > 100) { swipe('right'); }
    else if (currentX < -100) { swipe('left'); }
    else {
      wrap.style.transition = 'transform 0.3s ease';
      wrap.style.transform = '';
      setTimeout(() => { wrap.style.transition = ''; }, 300);
      const like = document.getElementById('stampLike');
      const nope = document.getElementById('stampNope');
      if(like) like.style.opacity=0; if(nope) nope.style.opacity=0;
    }
    currentX = 0;
  };

  wrap.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
  wrap.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  document.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

renderCard();
</script>
</body>
</html>
